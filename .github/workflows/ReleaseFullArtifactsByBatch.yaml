name: ReleaseFullArtifactsByBatch
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      # 断点续跑：发布中断后，从指定模块继续（此前已成功的批次重复执行会因坐标已存在被 Central 拒绝）
      start_from:
        description: '从哪个模块开始发布（将依次发布所选模块及其后的所有批次）'
        type: choice
        options:
          - 全量发布（所有批次）
          - 从 os-dependencies 开始
          - 从 meta-open 开始
          - 从 base 开始
          - 从 meta-model 开始
          - 从 meta-component 开始
          - 从 meta-sdk 开始
          - 从 meta-bom 开始
        default: 全量发布（所有批次）

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: CheckoutCode
        uses: actions/checkout@v7

      - name: SetupJava
        uses: actions/setup-java@v5
        with:
          java-version: '25' # 或你项目使用的JDK版本
          distribution: 'temurin'
          cache: 'maven'
          # 通常会在 pom.xml 或 settings.xml 中配置 gpg 相关信息

      - name: ImportGPGKey
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd
        with:
          # v6/v7 起输入名由 gpg-private-key 改为 gpg_private_key，写错会被静默忽略导致工作流失败（passphrase 仍为全小写无分隔符）
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: ConfigureMavenSettingsForSonatype
        env:
          # secrets 经 env 传递，run 块内用 $VAR 引用（防泄露，SonarCloud githubactions:S7636）
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_TOKEN: ${{ secrets.OSSRH_TOKEN }}
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>sonatype-nexus-staging</id>
                <username>${OSSRH_USERNAME}</username>
                <password>${OSSRH_TOKEN}</password>
              </server>
              <server>
                <id>sonatype-nexus-snapshots</id>
                <username>${OSSRH_USERNAME}</username>
                <password>${OSSRH_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
        shell: bash
        
      # - name: ListMavenProjects
      #   run: mvn -B projects:list
      - name: PublishArtifactsToMavenCentralByBatch
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}   # 假设你的 Maven GPG 插件配置或 settings.xml 使用这些变量
          OSSRH_TOKEN: ${{ secrets.OSSRH_TOKEN }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}      # 如果 Maven 配置需要明确 Key ID：
          JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8 "
          MAVEN_OPTS: "-Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8 --add-opens=jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.model=ALL-UNNAMED"
          START_FROM: ${{ inputs.start_from || '全量发布（所有批次）' }}
        run: |
         echo "======================================= 版本发布开始 ==================================================================="
         case "${START_FROM}" in
           "全量发布（所有批次）"|"从 os-dependencies 开始") START_BATCH=2 ;;
           "从 meta-open 开始")      START_BATCH=3 ;;
           "从 base 开始")           START_BATCH=4 ;;
           "从 meta-model 开始")     START_BATCH=5 ;;
           "从 meta-component 开始") START_BATCH=6 ;;
           "从 meta-sdk 开始")       START_BATCH=7 ;;
           "从 meta-bom 开始")       START_BATCH=8 ;;
           *) echo "[错误] 无法识别的起始批次：'${START_FROM}'（请通过工作流下拉选项触发）"; exit 1 ;;
         esac
         echo "[本次从「${START_FROM}」开始，即将执行第 ${START_BATCH} 批及其后批次]"
         # 打印本次发布参数（触发分支 / 发布版本 / 用户选择），便于事后据日志排查，无需回看前端操作记录
         RELEASE_VERSION=$(sed -n 's:.*<revision>\(.*\)</revision>.*:\1:p' pom.xml | head -n 1)
         if [ -z "${RELEASE_VERSION}" ]; then RELEASE_VERSION="(未能从根 pom.xml 解析到 <revision>)"; fi
         echo "======================================= 发布参数 ======================================================================="
         echo "[触发分支] ${GITHUB_REF_NAME}"
         echo "[触发用户] ${GITHUB_ACTOR}（运行编号 ${GITHUB_RUN_ID}）"
         echo "[发布版本] ${RELEASE_VERSION}"
         echo "[用户选择] ${START_FROM} → 起始批次 ${START_BATCH}"
         RANGE="批次 ${START_BATCH}~8"
         if [ "${START_BATCH}" -eq 8 ]; then RANGE="批次 8"; fi
         echo "[执行范围] 批次 1（本地预编译，固定执行）+ ${RANGE}"
         echo "======================================================================================================================="
         echo "======================================= 1.本地预先编译一次整个项目 ======================================================"
         echo "[批次 1] 本地预编译 发布任务开始"
         pwd
         mvn clean install -U
         if [ "${START_BATCH}" -le 2 ]; then
         echo "[批次 2] os-dependencies 发布任务开始"
         echo "======================================= 2.编译 os-dependencies ========================================================"
         cd os-dependencies       # 设置工作目录为 os-dependencies
         pwd
         mvn -B clean deploy -U
         cd ../                   # 设置工作目录为 ./
         else
         echo "[批次 2] os-dependencies 发布任务跳过（本次起始批次为 ${START_BATCH}）"
         fi
         if [ "${START_BATCH}" -le 3 ]; then
         echo "[批次 3] meta-open 发布任务开始"
         echo "======================================= 3.编译 meta-open =============================================================="
         pwd
         mvn -B clean deploy -pl :meta-open -am
         else
         echo "[批次 3] meta-open 发布任务跳过（本次起始批次为 ${START_BATCH}）"
         fi
         if [ "${START_BATCH}" -le 4 ]; then
         echo "[批次 4] base 发布任务开始"
         echo "======================================= 4.编译 base     ============================================================="
         cd base           # 设置工作目录为 base
         pwd
         mvn -B clean deploy -U
         cd ../
         else
         echo "[批次 4] base 发布任务跳过（本次起始批次为 ${START_BATCH}）"
         fi
         if [ "${START_BATCH}" -le 5 ]; then
         echo "[批次 5] meta-model 发布任务开始"
         echo "======================================= 5.编译 meta-model ============================================================="
         cd meta-model           # 设置工作目录为 meta-model
         pwd
         # echo "############################################### mvn help:effective-pom #####################################################"
         # mvn help:effective-pom -pl :model-test
         # echo "############################################### mvn help:effective-pom #####################################################"
         mvn -B clean deploy -U
         cd ../
         else
         echo "[批次 5] meta-model 发布任务跳过（本次起始批次为 ${START_BATCH}）"
         fi
         if [ "${START_BATCH}" -le 6 ]; then
         echo "[批次 6] meta-component 发布任务开始"
         echo "======================================= 6.编译 meta-component ========================================================="
         cd meta-component      # 设置工作目录为 meta-component
         pwd
         mvn -B clean deploy
         cd ../
         else
         echo "[批次 6] meta-component 发布任务跳过（本次起始批次为 ${START_BATCH}）"
         fi
         if [ "${START_BATCH}" -le 7 ]; then
         echo "[批次 7] meta-sdk 发布任务开始"
         echo "======================================= 7.编译 meta-sdk ==============================================================="
         cd meta-sdk           # 设置工作目录为 meta-sdk
         pwd
         mvn -B clean deploy -U
         cd ../
         else
         echo "[批次 7] meta-sdk 发布任务跳过（本次起始批次为 ${START_BATCH}）"
         fi
         if [ "${START_BATCH}" -le 8 ]; then
         echo "[批次 8] meta-bom 发布任务开始"
         echo "======================================= 8.编译 meta-bom ==============================================================="
         cd meta-bom           # 设置工作目录为 meta-bom
         pwd
         mvn -B clean deploy -U -e -X
         else
         echo "[批次 8] meta-bom 发布任务跳过（本次起始批次为 ${START_BATCH}）"
         fi
         echo "======================================= 版本发布完成 ==================================================================="
          
