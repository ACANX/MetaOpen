name: SonarCloudCodeAnalysis
permissions:
  contents: read
  
on:
  push:
    branches: [ 'dev', 'main', 'dependa', 'aa' ] # 在推送到主干分支时触发
  pull_request_target:
    branches: [ 'dev', 'main', 'dependa', 'aa' ] # 在任何针对主干分支的PR创建时触发（含 fork PR，需显式检出 merge ref）
    types: [opened, synchronize, reopened]
  workflow_dispatch:     

  
jobs:
  BuildAndScan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # SonarScanner可能需要完整的提交历史
          # pull_request_target 下默认检出 base 分支，需显式检出 PR 合并提交；push/workflow_dispatch 走事件默认 ref
          ref: ${{ github.event.pull_request && format('refs/pull/{0}/merge', github.event.pull_request.number) || '' }}
          # checkout v5 安全护栏：pull_request_target 检出 fork PR 代码需显式放行（本仓库 PR 仅来自可信协作者 abcnx）
          # codeql[actions/untrusted-checkout] 已知可接受风险，见 Docs/Dev/GitHubAction/PullRequestTargetAnalysis.md 第 4 节
          allow-unsafe-pr-checkout: true

      - name: SetupJDK
        uses: actions/setup-java@v5
        with:
          java-version: '25' # 或你的项目使用的JDK版本
          distribution: 'temurin'

      - name: CacheMavenDependencies
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: BuildAndAnalyzeWithSonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }} # 在GitHub仓库Secrets中设置的SonarCloud Token
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # GitHub自动提供的Token，用于上传PR检查结果
          # PR 上下文经 env 传递，避免将不可信输入（PR 分支名等）直接内插进 shell 脚本（防代码注入，CodeQL actions/code-injection）
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          # 收集各模块 JaCoCo 报告路径（target/site/jacoco/jacoco.xml），逗号拼接后传给 SonarCloud
          JACOCO_PATHS=$(find . -path '*/target/site/jacoco/jacoco.xml' | paste -sd, -)
          # 扫描器仅识别 pull_request 事件的 PR 上下文（GITHUB_REF=refs/pull/N/merge）；
          # pull_request_target 事件（GITHUB_REF=base 分支）无法自动识别 PR，需显式传入 PR 参数。push 事件走自动分支识别。
          SONAR_CONTEXT=""
          if [ "${{ github.event_name }}" = "pull_request_target" ]; then
            SONAR_CONTEXT="-Dsonar.pullRequest.key=${PR_NUMBER} -Dsonar.pullRequest.branch=${PR_HEAD_REF} -Dsonar.pullRequest.base=${PR_BASE_REF}"
          fi
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=ACANX_MetaOpen -Dsonar.organization=acanx -Dsonar.host.url=https://sonarcloud.io -Dsonar.token=$SONAR_TOKEN -Dsonar.qualitygate.wait=false -Dsonar.coverage.jacoco.xmlReportPaths="$JACOCO_PATHS" ${SONAR_CONTEXT} -Dgpg.skip=true -e -X -U 
